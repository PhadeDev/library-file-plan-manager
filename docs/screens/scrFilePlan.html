<body>

  <script>
    const yaml = "Screens:\r\n  scrFilePlan:\r\n    Properties:\r\n      Fill: =RGBA(245, 246, 250, 1)\r\n    Children:\r\n      - lblTitle:\r\n          Control: Label@2.5.1\r\n          Properties:\r\n            Text: =\"Library & File Plan\"\r\n            X: =32\r\n            Y: =24\r\n            Width: =600\r\n            Height: =40\r\n            Size: =22\r\n            FontWeight: =FontWeight.Semibold\r\n            Color: =RGBA(30, 30, 45, 1)\r\n            Font: =Font.'Open Sans'\r\n      - txtSearch:\r\n          Control: ModernTextInput@1.1.0\r\n          Properties:\r\n            Placeholder: =\"Search by library name, team or sub-team...\"\r\n            Type: =TextInputType.Search\r\n            X: =32\r\n            Y: =72\r\n            Width: =480\r\n            Height: =44\r\n            OnChange: |-\r\n              =ClearCollect(\r\n                  colFilePlanFiltered,\r\n                  AddColumns(\r\n                      If(\r\n                          IsBlank(Trim(txtSearch.Text)),\r\n                          colFilePlan,\r\n                          Filter(\r\n                              colFilePlan,\r\n                              txtSearch.Text in DisplayName ||\r\n                              txtSearch.Text in Title ||\r\n                              txtSearch.Text in Team.Value ||\r\n                              txtSearch.Text in Coalesce(SubTeam.Value, \"\")\r\n                          )\r\n                      ),\r\n                      TeamName, Team.Value,\r\n                      SubTeamName, Coalesce(SubTeam.Value, \"\")\r\n                  )\r\n              );\r\n              ClearCollect(\r\n                  colTeamGroups,\r\n                  Sort(\r\n                      AddColumns(\r\n                          GroupBy(colFilePlanFiltered, TeamName, GroupedItems),\r\n                          ItemCount, CountRows(GroupedItems)\r\n                      ),\r\n                      TeamName,\r\n                      SortOrder.Ascending\r\n                  )\r\n              );\r\n              Clear(colFlatSource);\r\n              Collect(colFlatSource, AddColumns(colTeamGroups, RowType, \"Team\", SortKey, TeamName, RankInGroup, 0));\r\n              Collect(colFlatSource, AddColumns(colFilePlanFiltered, RowType, \"Library\", SortKey, TeamName, RankInGroup, 1));\r\n              If(\r\n                  !IsBlank(Trim(txtSearch.Text)),\r\n                  ClearCollect(colExpandedKeys, ShowColumns(colTeamGroups, TeamName)),\r\n                  Clear(colExpandedKeys)\r\n              )\r\n      - btnClearSearch:\r\n          Control: Classic/Button@2.2.0\r\n          Properties:\r\n            Text: =\"\u2715\"\r\n            Visible: =!IsBlank(Trim(txtSearch.Text))\r\n            Fill: =RGBA(0, 0, 0, 0)\r\n            HoverFill: =RGBA(230, 233, 245, 1)\r\n            PressedFill: =RGBA(230, 233, 245, 1)\r\n            Color: =RGBA(120, 120, 135, 1)\r\n            BorderThickness: =0\r\n            X: =516\r\n            Y: =72\r\n            Width: =36\r\n            Height: =44\r\n            OnSelect: |-\r\n              =Reset(txtSearch);\r\n              ClearCollect(colFilePlanFiltered, AddColumns(colFilePlan, TeamName, Team.Value, SubTeamName, Coalesce(SubTeam.Value, \"\")));\r\n              ClearCollect(colTeamGroups, Sort(AddColumns(GroupBy(colFilePlanFiltered, TeamName, GroupedItems), ItemCount, CountRows(GroupedItems)), TeamName, SortOrder.Ascending));\r\n              Clear(colFlatSource);\r\n              Collect(colFlatSource, AddColumns(colTeamGroups, RowType, \"Team\", SortKey, TeamName, RankInGroup, 0));\r\n              Collect(colFlatSource, AddColumns(colFilePlanFiltered, RowType, \"Library\", SortKey, TeamName, RankInGroup, 1));\r\n              Clear(colExpandedKeys)\r\n      - lblResultCount:\r\n          Control: Label@2.5.1\r\n          Properties:\r\n            Text: =If(IsBlank(Trim(txtSearch.Text)), \"All libraries \u2014 \", \"Showing \") & CountRows(colFilePlanFiltered) & \" librar\" & If(CountRows(colFilePlanFiltered) = 1, \"y\", \"ies\") & \" across \" & CountRows(colTeamGroups) & \" teams\"\r\n            X: =32\r\n            Y: =120\r\n            Width: =520\r\n            Height: =24\r\n            Size: =12\r\n            FontWeight: =If(IsBlank(Trim(txtSearch.Text)), FontWeight.Normal, FontWeight.Semibold)\r\n            Color: =If(IsBlank(Trim(txtSearch.Text)), RGBA(120, 120, 135, 1), RGBA(124, 77, 255, 1))\r\n            Font: =Font.'Open Sans'\r\n      - galRows:\r\n          Control: Gallery@2.15.0\r\n          Variant: Vertical\r\n          Properties:\r\n            Items: |-\r\n              =SortByColumns(\r\n                  Filter(\r\n                      colFlatSource,\r\n                      (RowType = \"Team\") ||\r\n                      (RowType = \"Library\" && TeamName in colExpandedKeys.TeamName)\r\n                  ),\r\n                  \"SortKey\", SortOrder.Ascending,\r\n                  \"RankInGroup\", SortOrder.Ascending,\r\n                  \"DisplayName\", SortOrder.Ascending\r\n              )\r\n            TemplateSize: =56\r\n            Height: =700\r\n            Width: =1000\r\n            X: =32\r\n            Y: =156\r\n            TemplatePadding: =4\r\n            LoadingSpinner: =LoadingSpinner.None\r\n          Children:\r\n            - recTeamHeaderBg:\r\n                Control: Classic/Button@2.2.0\r\n                Properties:\r\n                  Text: =\"\"\r\n                  DisplayMode: =DisplayMode.View\r\n                  Visible: =ThisItem.RowType = \"Team\"\r\n                  Fill: =RGBA(230, 233, 245, 1)\r\n                  HoverFill: =RGBA(230, 233, 245, 1)\r\n                  PressedFill: =RGBA(230, 233, 245, 1)\r\n                  BorderColor: =RGBA(210, 213, 228, 1)\r\n                  BorderThickness: =1\r\n                  RadiusTopLeft: =10\r\n                  RadiusTopRight: =10\r\n                  RadiusBottomLeft: =10\r\n                  RadiusBottomRight: =10\r\n                  X: =0\r\n                  Y: =0\r\n                  Width: =1000\r\n                  Height: =48\r\n            - lblChevron:\r\n                Control: Label@2.5.1\r\n                Properties:\r\n                  Text: =If(ThisItem.TeamName in colExpandedKeys.TeamName, \"v\", \">\")\r\n                  Visible: =ThisItem.RowType = \"Team\"\r\n                  X: =16\r\n                  Y: =0\r\n                  Width: =24\r\n                  Height: =48\r\n                  Size: =16\r\n                  Color: =RGBA(60, 60, 80, 1)\r\n                  VerticalAlign: =VerticalAlign.Middle\r\n                  Font: =Font.'Open Sans'\r\n            - lblTeamName:\r\n                Control: Label@2.5.1\r\n                Properties:\r\n                  Text: =ThisItem.TeamName\r\n                  Visible: =ThisItem.RowType = \"Team\"\r\n                  X: =48\r\n                  Y: =0\r\n                  Width: =600\r\n                  Height: =48\r\n                  Size: =15\r\n                  FontWeight: =FontWeight.Semibold\r\n                  Color: =RGBA(30, 30, 45, 1)\r\n                  VerticalAlign: =VerticalAlign.Middle\r\n                  Font: =Font.'Open Sans'\r\n            - lblTeamCount:\r\n                Control: Label@2.5.1\r\n                Properties:\r\n                  Text: =ThisItem.ItemCount & \" librar\" & If(ThisItem.ItemCount = 1, \"y\", \"ies\")\r\n                  Visible: =ThisItem.RowType = \"Team\"\r\n                  X: =840\r\n                  Y: =0\r\n                  Width: =140\r\n                  Height: =48\r\n                  Size: =12\r\n                  Color: =RGBA(120, 120, 135, 1)\r\n                  Align: =Align.Right\r\n                  VerticalAlign: =VerticalAlign.Middle\r\n                  Font: =Font.'Open Sans'\r\n            - btnTeamHeaderTap:\r\n                Control: Classic/Button@2.2.0\r\n                Properties:\r\n                  Text: =\"\"\r\n                  Visible: =ThisItem.RowType = \"Team\"\r\n                  Fill: =RGBA(0, 0, 0, 0)\r\n                  HoverFill: =Self.Fill\r\n                  PressedFill: =Self.Fill\r\n                  BorderThickness: =0\r\n                  X: =0\r\n                  Y: =0\r\n                  Width: =1000\r\n                  Height: =48\r\n                  OnSelect: |-\r\n                    =If(\r\n                        ThisItem.TeamName in colExpandedKeys.TeamName,\r\n                        RemoveIf(colExpandedKeys, TeamName = ThisItem.TeamName),\r\n                        Collect(colExpandedKeys, {TeamName: ThisItem.TeamName})\r\n                    )\r\n            - recRowBg:\r\n                Control: Classic/Button@2.2.0\r\n                Properties:\r\n                  Text: =\"\"\r\n                  DisplayMode: =DisplayMode.View\r\n                  Visible: =ThisItem.RowType = \"Library\"\r\n                  Fill: =RGBA(255, 255, 255, 1)\r\n                  HoverFill: =RGBA(255, 255, 255, 1)\r\n                  PressedFill: =RGBA(255, 255, 255, 1)\r\n                  BorderColor: =RGBA(238, 239, 245, 1)\r\n                  BorderThickness: =1\r\n                  X: =0\r\n                  Y: =0\r\n                  Width: =1000\r\n                  Height: =52\r\n            - lblLibName:\r\n                Control: Label@2.5.1\r\n                Properties:\r\n                  Text: =ThisItem.DisplayName\r\n                  Visible: =ThisItem.RowType = \"Library\"\r\n                  X: =56\r\n                  Y: =0\r\n                  Width: =360\r\n                  Height: =52\r\n                  Size: =14\r\n                  Color: =RGBA(30, 30, 45, 1)\r\n                  VerticalAlign: =VerticalAlign.Middle\r\n                  Font: =Font.'Open Sans'\r\n            - lblSubTeamTag:\r\n                Control: Label@2.5.1\r\n                Properties:\r\n                  Text: =ThisItem.SubTeamName\r\n                  Visible: =ThisItem.RowType = \"Library\" && !IsBlank(ThisItem.SubTeamName) && ThisItem.SubTeamName <> \"\"\r\n                  X: =430\r\n                  Y: =0\r\n                  Width: =190\r\n                  Height: =52\r\n                  Size: =12\r\n                  Color: =RGBA(120, 120, 135, 1)\r\n                  VerticalAlign: =VerticalAlign.Middle\r\n                  Font: =Font.'Open Sans'\r\n            - lblLtdBadge:\r\n                Control: Label@2.5.1\r\n                Properties:\r\n                  Text: =\"LTD\"\r\n                  Visible: =ThisItem.RowType = \"Library\" && ThisItem.IsLimited\r\n                  X: =630\r\n                  Y: =12\r\n                  Width: =50\r\n                  Height: =28\r\n                  Size: =11\r\n                  FontWeight: =FontWeight.Bold\r\n                  Color: =RGBA(155, 45, 25, 1)\r\n                  Fill: =RGBA(250, 225, 218, 1)\r\n                  Align: =Align.Center\r\n                  VerticalAlign: =VerticalAlign.Middle\r\n                  Font: =Font.'Open Sans'\r\n            - btnCopy:\r\n                Control: ModernButton@1.0.0\r\n                Properties:\r\n                  Text: =\"Copy link\"\r\n                  Visible: =ThisItem.RowType = \"Library\"\r\n                  X: =700\r\n                  Y: =8\r\n                  Width: =110\r\n                  Height: =36\r\n                  OnSelect: |-\r\n                    =Copy(varTenantHost & ThisItem.LibraryUrl)\r\n            - btnOpen:\r\n                Control: ModernButton@1.0.0\r\n                Properties:\r\n                  Text: =\"Open\"\r\n                  Visible: =ThisItem.RowType = \"Library\"\r\n                  X: =830\r\n                  Y: =8\r\n                  Width: =110\r\n                  Height: =36\r\n                  OnSelect: |-\r\n                    =Launch(varTenantHost & ThisItem.LibraryUrl)\r\n";
    const stamp = "v2.1  \u2014  Built 11 Aug 2026  12:20 BST";

    function firstLines() {
      return yaml.split(/\r?\n/).slice(0, 8).join('\n');
    }

    async function copyYAML() {
      const status = document.getElementById('status');
      if (!yaml.startsWith('Screens:\r\n  ') && !yaml.startsWith('Screens:\n  ')) {
        status.textContent = 'Refusing to copy: YAML does not start with Screens:';
        status.className = 'err';
        return;
      }
      if (yaml.includes('\r\n    Control: Screen\r\n') || yaml.includes('\n    Control: Screen\n')) {
        status.textContent = 'Refusing to copy: stale YAML still contains screen-level Control: Screen.';
        status.className = 'err';
        return;
      }
      try {
        await navigator.clipboard.writeText(yaml);
        status.textContent = '✓ Copied ' + stamp + '. First YAML line: ' + yaml.split(/\r?\n/)[0];
        status.className = 'ok';
        setTimeout(() => {
          status.textContent = 'Click to copy again';
          status.className = '';
        }, 4000);
      } catch (e) {
        status.textContent = 'Clipboard blocked — select the text below and copy manually.';
        status.className = 'err';
        const pre = document.createElement('pre');
        pre.style = 'font-size:9px;max-height:200px;overflow:auto;background:#1a1a2e;padding:8px;border-radius:6px;text-align:left;';
        pre.textContent = yaml;
        document.body.appendChild(pre);
      }
    }

    document.getElementById('preview').textContent = 'Clipboard payload preview (' + stamp + ')\n' + firstLines();
  </script>
</body>
