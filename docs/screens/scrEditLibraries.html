n              ClearCollect(colSubTeamGroups, AddColumns(GroupBy(Filter(colFilePlanFiltered, !IsBlank(SubTeamName) && SubTeamName <> \"\"), TeamName, SubTeamName, GroupedItems), ItemCount, CountRows(GroupedItems)));\r\n              Clear(colFlatSource);\r\n              Collect(colFlatSource, AddColumns(colTeamGroups, RowType, \"Team\", SortKey, TeamSortKey, SubSortKey, \"\", RankInGroup, 0));\r\n              Collect(colFlatSource, AddColumns(colSubTeamGroups, RowType, \"SubTeam\", SortKey, If(TeamName = \"Uncategorised\", \"zzz_\" & TeamName, TeamName), SubSortKey, SubTeamName, RankInGroup, 1));\r\n              Collect(colFlatSource, AddColumns(colFilePlanFiltered, RowType, \"Library\", SortKey, If(TeamName = \"Uncategorised\", \"zzz_\" & TeamName, TeamName), SubSortKey, If(IsBlank(SubTeamName) || SubTeamName = \"\", \"zzz_none\", SubTeamName), RankInGroup, If(IsBlank(SubTeamName) || SubTeamName = \"\", 1, 2)));\r\n              Clear(colSelectedLibraries)\r\n            Text: =\"Save All\"\r\n            Visible: =varIsAdmin\r\n            Width: =140\r\n            X: =1158\r\n            Y: =166\r\n      - lblSaveStatus:\r\n          Control: Label@2.5.1\r\n          Properties:\r\n            Color: =RGBA(124, 77, 255, 1)\r\n            Font: =Font.'Open Sans'\r\n            FontWeight: =FontWeight.Semibold\r\n            Height: =24\r\n            Size: =12\r\n            Text: =If(varEditSaving, \"Saving...\", varEditSaveStatus)\r\n            Visible: =varIsAdmin && (varEditSaving || !IsBlank(varEditSaveStatus))\r\n            Width: =900\r\n            X: =32\r\n            Y: =214\r\n      - lblLimitedNote:\r\n          Control: Label@2.5.1\r\n          Properties:\r\n            Color: =RGBA(180, 120, 30, 1)\r\n            Font: =Font.'Open Sans'\r\n            Height: =24\r\n            Size: =11\r\n            Text: =\"Flipping \"\"Limited access\"\" here only corrects the record. If real SharePoint permissions are actually wrong, that still needs fixing directly in SharePoint (or via Manage Permissions, once built).\"\r\n            Visible: =varIsAdmin\r\n            Width: =900\r\n            X: =32\r\n            Y: =242\r\n      - galEditCards:\r\n          Control: Gallery@2.15.0\r\n          Variant: Vertical\r\n          Properties:\r\n            Height: =600\r\n            Items: =colEditQueue\r\n            LoadingSpinner: =LoadingSpinner.None\r\n            TemplatePadding: =8\r\n            TemplateSize: =148\r\n            Visible: =varIsAdmin\r\n            Width: =1318\r\n            X: =32\r\n            Y: =168\r\n          Children:\r\n            - recCardBg:\r\n                Control: Classic/Button@2.2.0\r\n                Properties:\r\n                  BorderColor: =RGBA(230, 233, 245, 1)\r\n                  BorderThickness: =1\r\n                  DisplayMode: =DisplayMode.View\r\n                  Fill: =RGBA(255, 255, 255, 1)\r\n                  Height: =140\r\n                  HoverFill: =Self.Fill\r\n                  PressedFill: =Self.Fill\r\n                  Text: =\"\"\r\n                  Width: =1302\r\n            - lblCardTitle:\r\n                Control: Label@2.5.1\r\n                Properties:\r\n                  Color: =RGBA(30, 30, 45, 1)\r\n                  Font: =Font.'Open Sans'\r\n                  FontWeight: =FontWeight.Semibold\r\n                  Height: =28\r\n                  Size: =15\r\n                  Text: =Substitute(ThisItem.EffectiveName, \"_\", \" \")\r\n                  Width: =700\r\n                  X: =20\r\n                  Y: =12\r\n            - lblCardUrl:\r\n                Control: Label@2.5.1\r\n                Properties:\r\n                  Color: =RGBA(150, 150, 165, 1)\r\n                  Font: =Font.'Open Sans'\r\n                  Height: =20\r\n                  Size: =10\r\n                  Text: =ThisItem.LibraryUrl\r\n                  Width: =700\r\n                  X: =20\r\n                  Y: =40\r\n e: =11\r\n                  Text: =\"Sub-Team\"\r\n                  Width: =240\r\n                  X: =560\r\n                  Y: =66\r\n            - txtCardSubTeam:\r\n                Control: ModernTextInput@1.1.2\r\n                Properties:\r\n                  Default: =ThisItem.SubTeamName\r\n                  Height: =40\r\n                  OnChange: |-\r\n                    =Patch(colEditQueue, ThisItem, {SubTeamName: Self.Text})\r\n                  Placeholder: =\"Optional\"\r\n                  Width: =240\r\n                  X: =560\r\n                  Y: =86\r\n            - chkCardIsLimited:\r\n                Control: CheckBox@0.0.30\r\n                Properties:\r\n                  BasePaletteColor: =RGBA(155, 45, 25, 1)\r\n                  CheckboxSize: =22\r\n                  Checked: =ThisItem.IsLimited\r\n                  Label: =\"Limited access\"\r\n                  OnCheck: |-\r\n                    =Patch(colEditQueue, ThisItem, {IsLimited: true})\r\n                  OnUncheck: |-\r\n                    =Patch(colEditQueue, ThisItem, {IsLimited: false})\r\n                  Width: =220\r\n                  X: =820\r\n                  Y: =78\r\n            - btnRemoveFromCart:\r\n                Control: ModernButton@1.0.0\r\n                Properties:\r\n                  OnSelect: =RemoveIf(colEditQueue, LibraryUrl = ThisItem.LibraryUrl)\r\n                  Text: =\"Remove\"\r\n                  Width: =84\r\n                  X: =1214\r\n                  Y: =12\r\n";
    const stamp = "v2.4  —  Built 26 Sep 2026  04:15 BST";

    function firstLines() {
      return yaml.split(/\r?\n/).slice(0, 8).join('\n');
    }

    async function copyYAML() {
      const status = document.getElementById('status');
      if (!yaml.startsWith('Screens:\r\n  ') && !yaml.startsWith('Screens:\n  ')) {
        status.textContent = 'Refusing to copy: YAML does not start with Screens:';
        status.className = 'err';
        return;
      }
      if (yaml.includes('\r\n    Control: Screen\r\n') || yaml.includes('\n    Control: Screen\n')) {
        status.textContent = 'Refusing to copy: stale YAML still contains screen-level Control: Screen.';
        status.className = 'err';
        return;
      }
      try {
        await navigator.clipboard.writeText(yaml);
        status.textContent = '✓ Copied ' + stamp + '. First YAML line: ' + yaml.split(/\r?\n/)[0];
        status.className = 'ok';
        setTimeout(() => {
          status.textContent = 'Click to copy again';
          status.className = '';
        }, 4000);
      } catch (e) {
        status.textContent = 'Clipboard blocked — select the text below and copy manually.';
        status.className = 'err';
        const pre = document.createElement('pre');
        pre.style = 'font-size:9px;max-height:200px;overflow:auto;background:#1a1a2e;padding:8px;border-radius:6px;text-align:left;';
        pre.textContent = yaml;
        document.body.appendChild(pre);
      }
    }

    document.getElementById('preview').textContent = 'Clipboard payload preview (' + stamp + ')\n' + firstLines();
  </script>
