=\"Remove\"\r\n                  X: =730\r\n                  Y: =6\r\n                  Width: =190\r\n                  Height: =36\r\n                  OnSelect: |-\r\n                    =Set(varPermBusy, true);\r\n                    Set(varPermResult, 'Manage Library Permissions'.Run(varSelectedLibraryTitle, \"Remove\", {GroupName: ThisItem.GroupName, PermissionLevel: \"\", SiteUrl: \"https://modgovuk.sharepoint.com/teams/1598\"}));\r\n                    If(varPermResult.Success, Notify(varPermResult.Message, NotificationType.Success), Notify(\"Failed: \" & varPermResult.Message, NotificationType.Error));\r\n                    Set(varPermResult, 'Manage Library Permissions'.Run(varSelectedLibraryTitle, \"List\", {GroupName: \"\", PermissionLevel: \"\", SiteUrl: \"https://modgovuk.sharepoint.com/teams/1598\"}));\r\n                    ClearCollect(colCurrentPermissions, varPermResult.Permissions);\r\n                    Set(varPermBusy, false)\r\n      - lblAddSectionHeading:\r\n          Control: Label@2.5.1\r\n          Properties:\r\n            Text: =\"Add a group\"\r\n            Visible: =varIsAdmin && !IsBlank(varSelectedLibraryTitle)\r\n            X: =32\r\n            Y: =460\r\n            Width: =400\r\n            Height: =24\r\n            Size: =13\r\n            Color: =RGBA(120, 120, 135, 1)\r\n            Font: =Font.'Open Sans'\r\n      - txtAddGroupName:\r\n          Control: ModernTextInput@1.1.0\r\n          Properties:\r\n            Placeholder: =\"Group name, e.g. SG_Cadets-Admin-Ltd_MEM\"\r\n            Type: =TextInputType.SingleLine\r\n            Visible: =varIsAdmin && !IsBlank(varSelectedLibraryTitle)\r\n            X: =32\r\n            Y: =488\r\n            Width: =420\r\n            Height: =44\r\n      - drpAddLevel:\r\n          Control: ModernDropdown@1.0.1\r\n          Properties:\r\n            Items: |-\r\n              =[\"Full Control\", \"Contribute\", \"Read\"]\r\n            Visible: =varIsAdmin && !IsBlank(varSelectedLibraryTitle)\r\n            X: =468\r\n            Y: =488\r\n            Width: =220\r\n            Height: =44\r\n      - btnAddPermission:\r\n          Control: ModernButton@1.0.0\r\n          Properties:\r\n            Text: =If(varPermBusy, \"Working...\", \"Add\")\r\n            DisplayMode: =If(varPermBusy, DisplayMode.Disabled, DisplayMode.Edit)\r\n            Visible: =varIsAdmin && !IsBlank(varSelectedLibraryTitle)\r\n            X: =704\r\n            Y: =488\r\n            Width: =140\r\n            Height: =44\r\n            OnSelect: |-\r\n              =If(\r\n                  IsBlank(Trim(txtAddGroupName.Text)) || IsBlank(drpAddLevel.Selected),\r\n                  Notify(\"Group name and permission level are both required.\", NotificationType.Error),\r\n                  Set(varPermBusy, true);\r\n                  Set(varPermResult, 'Manage Library Permissions'.Run(varSelectedLibraryTitle, \"Add\", {GroupName: Trim(txtAddGroupName.Text), PermissionLevel: drpAddLevel.Selected.Value, SiteUrl: \"https://modgovuk.sharepoint.com/teams/1598\"}));\r\n                  If(varPermResult.Success, Notify(varPermResult.Message, NotificationType.Success), Notify(\"Failed: \" & varPermResult.Message, NotificationType.Error));\r\n                  Set(varPermResult, 'Manage Library Permissions'.Run(varSelectedLibraryTitle, \"List\", {GroupName: \"\", PermissionLevel: \"\", SiteUrl: \"https://modgovuk.sharepoint.com/teams/1598\"}));\r\n                  ClearCollect(colCurrentPermissions, varPermResult.Permissions);\r\n                  Reset(txtAddGroupName);\r\n                  Reset(drpAddLevel);\r\n                  Set(varPermBusy, false)\r\n              )\r\n";

    function firstLines() {
      return yaml.split(/\r?\n/).slice(0, 8).join('\n');
    }

    async function copyYAML() {
      const status = document.getElementById('status');
      if (!yaml.startsWith('Screens:\r\n  ') && !yaml.startsWith('Screens:\n  ')) {
        status.textContent = 'Refusing to copy: YAML does not start with Screens:';
        status.className = 'err';
        return;
      }
      if (yaml.includes('\r\n    Control: Screen\r\n') || yaml.includes('\n    Control: Screen\n')) {
        status.textContent = 'Refusing to copy: stale YAML still contains screen-level Control: Screen.';
        status.className = 'err';
        return;
      }
      try {
        await navigator.clipboard.writeText(yaml);
        status.textContent = '✓ Copied ' + stamp + '. First YAML line: ' + yaml.split(/\r?\n/)[0];
        status.className = 'ok';
        setTimeout(() => {
          status.textContent = 'Click to copy again';
          status.className = '';
        }, 4000);
      } catch (e) {
        status.textContent = 'Clipboard blocked — select the text below and copy manually.';
        status.className = 'err';
        const pre = document.createElement('pre');
        pre.style = 'font-size:9px;max-height:200px;overflow:auto;background:#1a1a2e;padding:8px;border-radius:6px;text-align:left;';
        pre.textContent = yaml;
        document.body.appendChild(pre);
      }
