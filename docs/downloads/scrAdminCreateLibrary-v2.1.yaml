Screens:
  scrAdminCreateLibrary:
    Properties:
      Fill: =RGBA(245, 246, 250, 1)
      OnVisible: |-
        =Set(varCreateStep, 1);
        Set(varRegisterOnly, false);
        Set(varModeChosen, false);
        Set(varWebDefault, "");
        Reset(drpTeam);
        Reset(txtSubTeam);
        Reset(txtExtraPrefix);
        Reset(txtDisplayName);
        Reset(txtWebAddress);
        Reset(txtExistingLibraryTitle);
        Reset(txtExistingDisplayName);
        Reset(txtCategories);
        Reset(tglIsLimited)
    Children:
      - lblTitle_1:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(30, 30, 45, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =36
            Size: =22
            Text: ="Create a library"
            Visible: =true
            Width: =700
            X: =32
            Y: =84
      - lblWizardIntro:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(120, 120, 135, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Size: =12
            Text: ="Answer three short steps for each library. Add as many as you like to the list on the right, then create them all at once."
            Visible: =varIsAdmin
            Width: =1100
            X: =32
            Y: =120
      - recAccessDeniedBg:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(210, 150, 150, 1)
            BorderThickness: =1
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(250, 235, 235, 1)
            Height: =60
            HoverFill: =RGBA(250, 235, 235, 1)
            PressedFill: =RGBA(250, 235, 235, 1)
            Text: =""
            Visible: =!varIsAdmin
            Width: =600
            X: =32
            Y: =150
      - lblAccessDenied:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(140, 40, 40, 1)
            Font: =Font.'Open Sans'
            Height: =60
            Text: ="This screen is restricted. Your account (" & User().Email & ") isn't on the admin list."
            Visible: =!varIsAdmin
            Width: =560
            X: =52
            Y: =150
      - recWizardCard:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(220, 222, 232, 1)
            BorderThickness: =1
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(255, 255, 255, 1)
            Height: =584
            HoverFill: =Self.Fill
            PressedFill: =Self.Fill
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Text: =""
            Visible: =varIsAdmin
            Width: =720
            X: =32
            Y: =156
      - lblPill1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =If(varCreateStep = 1, RGBA(255, 255, 255, 1), If(varCreateStep > 1, RGBA(21, 62, 53, 1), RGBA(90, 90, 105, 1)))
            Fill: =If(varCreateStep = 1, RGBA(83, 42, 69, 1), If(varCreateStep > 1, RGBA(225, 240, 232, 1), RGBA(236, 238, 244, 1)))
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =34
            Size: =12
            Text: =If(varCreateStep > 1, "✓  ", "1   ") & "Where it belongs"
            Visible: =varIsAdmin
            Width: =212
            X: =56
            Y: =172
      - lblPill2:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =If(varCreateStep = 2, RGBA(255, 255, 255, 1), If(varCreateStep > 2, RGBA(21, 62, 53, 1), RGBA(90, 90, 105, 1)))
            Fill: =If(varCreateStep = 2, RGBA(83, 42, 69, 1), If(varCreateStep > 2, RGBA(225, 240, 232, 1), RGBA(236, 238, 244, 1)))
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =34
            Size: =12
            Text: =If(varCreateStep > 2, "✓  ", "2   ") & "Name it"
            Visible: =varIsAdmin
            Width: =212
            X: =286
            Y: =172
      - lblPill3:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =If(varCreateStep = 3, RGBA(255, 255, 255, 1), If(varCreateStep > 3, RGBA(21, 62, 53, 1), RGBA(90, 90, 105, 1)))
            Fill: =If(varCreateStep = 3, RGBA(83, 42, 69, 1), If(varCreateStep > 3, RGBA(225, 240, 232, 1), RGBA(236, 238, 244, 1)))
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =34
            Size: =12
            Text: =If(varCreateStep > 3, "✓  ", "3   ") & "Options"
            Visible: =varIsAdmin
            Width: =212
            X: =516
            Y: =172
      - lblStepTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(30, 30, 45, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =30
            Size: =18
            Text: =Switch(varCreateStep, 1, "Where does it belong?", 2, If(varRegisterOnly, "Which library already exists?", "What is it called?"), "Options and review")
            Visible: =varIsAdmin
            Width: =672
            X: =56
            Y: =222
      - lblStepIntro:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(90, 90, 105, 1)
            Font: =Font.'Open Sans'
            Height: =40
            Size: =12
            Text: =Switch(varCreateStep, 1, "Choose whether you are creating a new library or adding one that already exists. The rest of the form appears once you choose.", 2, If(varRegisterOnly, "Tell the app which existing library to add to the file plan.", "Type the name people will see. The web address is filled in for you, and you can change it."), "Last checks. Then add it to the list on the right.")
            Visible: =varIsAdmin
            Width: =672
            X: =56
            Y: =254
      - btnModeNew:
          Control: ModernButton@1.0.0
          Properties:
            Appearance: =If(varModeChosen && !varRegisterOnly, ButtonAppearance.Primary, ButtonAppearance.Outline)
            Height: =44
            OnSelect: =Set(varRegisterOnly, false); Set(varModeChosen, true)
            Text: ="Create a new library"
            Visible: =varIsAdmin && varCreateStep = 1
            Width: =328
            X: =56
            Y: =302
      - btnModeExisting:
          Control: ModernButton@1.0.0
          Properties:
            Appearance: =If(varModeChosen && varRegisterOnly, ButtonAppearance.Primary, ButtonAppearance.Outline)
            Height: =44
            OnSelect: =Set(varRegisterOnly, true); Set(varModeChosen, true)
            Text: ="Add one that already exists"
            Visible: =varIsAdmin && varCreateStep = 1
            Width: =328
            X: =400
            Y: =302
      - lblModeHint:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(83, 42, 69, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =13
            Text: ="Pick one of the two options above to continue."
            Visible: =varIsAdmin && varCreateStep = 1 && !varModeChosen
            Width: =672
            X: =56
            Y: =362
      - lblTeamLbl:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(30, 30, 45, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =13
            Text: ="Team"
            Visible: =varIsAdmin && varCreateStep = 1 && varModeChosen
            Width: =672
            X: =56
            Y: =362
      - lblTeamHelp:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(90, 90, 105, 1)
            Font: =Font.'Open Sans'
            Height: =36
            Size: =12
            Text: ="Which team owns this library? The team number, for example 04, becomes the start of the library name and web address."
            Visible: =varIsAdmin && varCreateStep = 1 && varModeChosen
            Width: =672
            X: =56
            Y: =384
      - drpTeam:
          Control: ModernDropdown@1.0.3
          Properties:
            BorderColor: =RGBA(200, 202, 214, 1)
            BorderThickness: =1
            Color: =RGBA(30, 30, 45, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            ItemDisplayText: =ThisItem.Value
            Items: =Choices(LibraryFilePlan.Team)
            Visible: =varIsAdmin && varCreateStep = 1 && varModeChosen
            Width: =672
            X: =56
            Y: =422
      - lblSubTeamLbl:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(30, 30, 45, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =13
            Text: ="Sub-Team (optional)"
            Visible: =varIsAdmin && varCreateStep = 1 && varModeChosen
            Width: =328
            X: =56
            Y: =482
      - lblSubTeamHelp:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(90, 90, 105, 1)
            Font: =Font.'Open Sans'
            Height: =56
            Size: =12
            Text: ="A grouping inside the team, such as Training Wing, used only to keep the File Plan tidy. It does not change the web address. Leave blank if unsure."
            Visible: =varIsAdmin && varCreateStep = 1 && varModeChosen
            Width: =328
            X: =56
            Y: =504
      - txtSubTeam:
          Control: ModernTextInput@1.1.2
          Properties:
            BorderColor: =RGBA(200, 202, 214, 1)
            BorderThickness: =1
            Color: =RGBA(30, 30, 45, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="e.g. Training Wing (optional)"
            Visible: =varIsAdmin && varCreateStep = 1 && varModeChosen
            Width: =328
            X: =56
            Y: =564
      - lblExtraPrefixLbl:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(30, 30, 45, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =13
            Text: ="Extra prefix (optional)"
            Visible: =varIsAdmin && varCreateStep = 1 && varModeChosen && !varRegisterOnly
            Width: =328
            X: =400
            Y: =482
      - lblExtraPrefixHelp:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(90, 90, 105, 1)
            Font: =Font.'Open Sans'
            Height: =56
            Size: =12
            Text: ="The rest of the file plan code after the team number. Under Team 04, typing 04_03 makes the name start 04_04_03. Leave blank if unsure."
            Visible: =varIsAdmin && varCreateStep = 1 && varModeChosen && !varRegisterOnly
            Width: =328
            X: =400
            Y: =504
      - txtExtraPrefix:
          Control: ModernTextInput@1.1.2
          Properties:
            BorderColor: =RGBA(200, 202, 214, 1)
            BorderThickness: =1
            Color: =RGBA(30, 30, 45, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="e.g. 04_03 (optional)"
            Visible: =varIsAdmin && varCreateStep = 1 && varModeChosen && !varRegisterOnly
            Width: =328
            X: =400
            Y: =564
      - lblPrefixPreview:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(21, 62, 53, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =12
            Text: |-
              =If(IsBlank(drpTeam.Selected.Value), "", "Name and web address will start with:  " & (IfError(Left(drpTeam.Selected.Value, Find("_", drpTeam.Selected.Value) - 1), "") & If(IsBlank(Trim(txtExtraPrefix.Text)), "", "_" & Trim(txtExtraPrefix.Text))) & "_")
            Visible: =varIsAdmin && varCreateStep = 1 && varModeChosen && !varRegisterOnly
            Width: =672
            X: =56
            Y: =616
      - lblNameLbl:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(30, 30, 45, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =13
            Text: ="Library name"
            Visible: =varIsAdmin && varCreateStep = 2 && !varRegisterOnly
            Width: =672
            X: =56
            Y: =302
      - lblNameHelp:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(90, 90, 105, 1)
            Font: =Font.'Open Sans'
            Height: =36
            Size: =12
            Text: ="The name people will see, for example Standard Operating Procedures. Do not type the team number or prefix, the app adds those for you."
            Visible: =varIsAdmin && varCreateStep = 2 && !varRegisterOnly
            Width: =672
            X: =56
            Y: =324
      - txtDisplayName:
          Control: ModernTextInput@1.1.2
          Properties:
            BorderColor: =RGBA(200, 202, 214, 1)
            BorderThickness: =1
            Color: =RGBA(30, 30, 45, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            OnChange: |-
              =Set(varWebDefault, If(IsBlank(Trim(txtDisplayName.Text)), "", (IfError(Left(drpTeam.Selected.Value, Find("_", drpTeam.Selected.Value) - 1), "") & If(IsBlank(Trim(txtExtraPrefix.Text)), "", "_" & Trim(txtExtraPrefix.Text))) & "_" & Concat(MatchAll(Substitute(Substitute(Trim(txtDisplayName.Text), "&", "and"), " ", "_"), "[A-Za-z0-9_\-]"), FullMatch)));
              Reset(txtWebAddress)
            Placeholder: ="e.g. Standard Operating Procedures"
            Visible: =varIsAdmin && varCreateStep = 2 && !varRegisterOnly
            Width: =672
            X: =56
            Y: =362
      - lblWebLbl:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(30, 30, 45, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =13
            Text: ="Web address name"
            Visible: =varIsAdmin && varCreateStep = 2 && !varRegisterOnly
            Width: =672
            X: =56
            Y: =418
      - lblWebHelp:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(90, 90, 105, 1)
            Font: =Font.'Open Sans'
            Height: =54
            Size: =12
            Text: ="The last part of the library's web address, for example 14_Information_Testing. It is filled in for you from the library name. Change it if you want something shorter, such as 14_InfoTest. Letters, numbers, hyphens and underscores only, no spaces."
            Visible: =varIsAdmin && varCreateStep = 2 && !varRegisterOnly
            Width: =672
            X: =56
            Y: =440
      - txtWebAddress:
          Control: ModernTextInput@1.1.2
          Properties:
            BorderColor: =RGBA(200, 202, 214, 1)
            BorderThickness: =1
            Color: =RGBA(30, 30, 45, 1)
            Default: =varWebDefault
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="Filled in from the library name"
            Visible: =varIsAdmin && varCreateStep = 2 && !varRegisterOnly
            Width: =672
            X: =56
            Y: =498
      - recPreviewCard:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(215, 200, 235, 1)
            BorderThickness: =1
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(243, 237, 250, 1)
            Height: =92
            HoverFill: =Self.Fill
            PressedFill: =Self.Fill
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Text: =""
            Visible: =varIsAdmin && varCreateStep = 2 && !varRegisterOnly
            Width: =672
            X: =56
            Y: =556
      - lblPreviewHead:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(83, 42, 69, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =12
            Text: ="How it will look"
            Visible: =varIsAdmin && varCreateStep = 2 && !varRegisterOnly
            Width: =300
            X: =72
            Y: =561
      - lblPreviewName:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(30, 30, 45, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Size: =13
            Text: |-
              ="Name people see:   " & If(IsBlank(Trim(txtDisplayName.Text)), "(type a name above)", ((IfError(Left(drpTeam.Selected.Value, Find("_", drpTeam.Selected.Value) - 1), "") & If(IsBlank(Trim(txtExtraPrefix.Text)), "", "_" & Trim(txtExtraPrefix.Text))) & "_" & Trim(txtDisplayName.Text)))
            Visible: =varIsAdmin && varCreateStep = 2 && !varRegisterOnly
            Width: =640
            X: =72
            Y: =583
      - lblPreviewUrl:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(30, 30, 45, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Size: =13
            Text: |-
              ="Full web address:   " & varTenantHost & "/teams/1598/" & If(IsBlank(Trim(txtWebAddress.Text)), "(filled in from the name)", Trim(txtWebAddress.Text))
            Visible: =varIsAdmin && varCreateStep = 2 && !varRegisterOnly
            Width: =640
            X: =72
            Y: =610
      - lblWebError:
          Control: Label@2.5.1
          Properties:
            Color: =If((IsMatch(Trim(txtWebAddress.Text), "[A-Za-z0-9][A-Za-z0-9_\-]*") && Len(Trim(txtWebAddress.Text)) <= 100), RGBA(150, 90, 0, 1), RGBA(176, 40, 30, 1))
            Font: =Font.'Open Sans'
            Height: =32
            Size: =12
            Text: |-
              =If(IsBlank(Trim(txtDisplayName.Text)), "", If((IsMatch(Trim(txtWebAddress.Text), "[A-Za-z0-9][A-Za-z0-9_\-]*") && Len(Trim(txtWebAddress.Text)) <= 100), If(Lower(Left(Trim(txtWebAddress.Text), Len((IfError(Left(drpTeam.Selected.Value, Find("_", drpTeam.Selected.Value) - 1), "") & If(IsBlank(Trim(txtExtraPrefix.Text)), "", "_" & Trim(txtExtraPrefix.Text)))) + 1)) <> Lower((IfError(Left(drpTeam.Selected.Value, Find("_", drpTeam.Selected.Value) - 1), "") & If(IsBlank(Trim(txtExtraPrefix.Text)), "", "_" & Trim(txtExtraPrefix.Text))) & "_"), "Tip: web addresses normally start with " & (IfError(Left(drpTeam.Selected.Value, Find("_", drpTeam.Selected.Value) - 1), "") & If(IsBlank(Trim(txtExtraPrefix.Text)), "", "_" & Trim(txtExtraPrefix.Text))) & "_ so the library sorts into the file plan.", ""), "The web address name must use only letters, numbers, hyphens and underscores, and be between 1 and 100 characters."))
            Visible: =varIsAdmin && varCreateStep = 2 && !varRegisterOnly
            Width: =672
            X: =56
            Y: =652
      - lblExistingLbl:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(30, 30, 45, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =13
            Text: ="Existing library title"
            Visible: =varIsAdmin && varCreateStep = 2 && varRegisterOnly
            Width: =672
            X: =56
            Y: =302
      - lblExistingHelp:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(90, 90, 105, 1)
            Font: =Font.'Open Sans'
            Height: =36
            Size: =12
            Text: ="Type the title exactly as it appears in SharePoint (Site contents). It is added to the file plan only. Nothing is created or changed in SharePoint."
            Visible: =varIsAdmin && varCreateStep = 2 && varRegisterOnly
            Width: =672
            X: =56
            Y: =324
      - txtExistingLibraryTitle:
          Control: ModernTextInput@1.1.2
          Properties:
            BorderColor: =RGBA(200, 202, 214, 1)
            BorderThickness: =1
            Color: =RGBA(30, 30, 45, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="e.g. 07 PolicyANDPersonnel Pers Forms"
            Visible: =varIsAdmin && varCreateStep = 2 && varRegisterOnly
            Width: =672
            X: =56
            Y: =362
      - lblExistingNameLbl:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(30, 30, 45, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =13
            Text: ="Name to show in the file plan (optional)"
            Visible: =varIsAdmin && varCreateStep = 2 && varRegisterOnly
            Width: =672
            X: =56
            Y: =430
      - lblExistingNameHelp:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(90, 90, 105, 1)
            Font: =Font.'Open Sans'
            Height: =36
            Size: =12
            Text: ="Leave blank to use the library title as it is. Fill this in if you want a tidier name to appear in the File Plan."
            Visible: =varIsAdmin && varCreateStep = 2 && varRegisterOnly
            Width: =672
            X: =56
            Y: =452
      - txtExistingDisplayName:
          Control: ModernTextInput@1.1.2
          Properties:
            BorderColor: =RGBA(200, 202, 214, 1)
            BorderThickness: =1
            Color: =RGBA(30, 30, 45, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="e.g. Personnel Forms (optional)"
            Visible: =varIsAdmin && varCreateStep = 2 && varRegisterOnly
            Width: =672
            X: =56
            Y: =490
      - tglIsLimited:
          Control: ModernToggle@1.0.1
          Properties:
            Height: =32
            Label: ="Limited library"
            LabelPosition: ="After"
            Visible: =varIsAdmin && varCreateStep = 3
            Width: =672
            X: =56
            Y: =302
      - lblLimitedHelp:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(90, 90, 105, 1)
            Font: =Font.'Open Sans'
            Height: =52
            Size: =12
            Text: =If(varRegisterOnly, "Switch on if this existing library is a Limited one. This only records it in the file plan. It does not change the library permissions.", "Switch on for a library that only a small group should see. Permissions are locked down so only SG_Cadets-Admin-Ltd_MEM and SG_IHUB get access. Leave off for a normal library.")
            Visible: =varIsAdmin && varCreateStep = 3
            Width: =672
            X: =56
            Y: =336
      - lblCategoriesLbl:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(30, 30, 45, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =13
            Text: ="Category (CAT) choices (optional)"
            Visible: =varIsAdmin && varCreateStep = 3 && !varRegisterOnly
            Width: =672
            X: =56
            Y: =396
      - lblCategoriesHelp:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(90, 90, 105, 1)
            Font: =Font.'Open Sans'
            Height: =36
            Size: =12
            Text: ="One choice per line, for example Policy, Guidance, Forms. People pick from these in the CAT column. Leave blank to add choices later."
            Visible: =varIsAdmin && varCreateStep = 3 && !varRegisterOnly
            Width: =672
            X: =56
            Y: =418
      - txtCategories:
          Control: ModernTextInput@1.1.2
          Properties:
            BorderColor: =RGBA(200, 202, 214, 1)
            BorderThickness: =1
            Color: =RGBA(30, 30, 45, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =72
            Placeholder: |-
              ="Optional: one category per line"
            Type: =TextInputType.Multiline
            Visible: =varIsAdmin && varCreateStep = 3 && !varRegisterOnly
            Width: =672
            X: =56
            Y: =456
      - recReviewCard:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(215, 200, 235, 1)
            BorderThickness: =1
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(243, 237, 250, 1)
            Height: =112
            HoverFill: =Self.Fill
            PressedFill: =Self.Fill
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Text: =""
            Visible: =varIsAdmin && varCreateStep = 3
            Width: =672
            X: =56
            Y: =540
      - lblReviewHead:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(83, 42, 69, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =12
            Text: ="Review"
            Visible: =varIsAdmin && varCreateStep = 3
            Width: =300
            X: =72
            Y: =546
      - lblReview:
